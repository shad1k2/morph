name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish (for example v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME:?}/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -n1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Test core
        run: ./gradlew :core:check --no-daemon --stacktrace

      - name: Require release signing secrets
        if: env.KEYSTORE_BASE64 == ''
        run: |
          echo "::error::RELEASE_KEYSTORE_BASE64 is not configured; refusing to publish an unsigned release."
          exit 1

      - name: Decode release keystore
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/morph-release.jks"
          test -s "$RUNNER_TEMP/morph-release.jks"

      - name: Build release APK
        env:
          MORPH_KEYSTORE: ${{ runner.temp }}/morph-release.jks
          MORPH_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          MORPH_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          MORPH_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n1)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"

      - name: Stage release artifact
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n1)"
          cp "$APK" "morph-${RELEASE_TAG}.apk"
          sha256sum "morph-${RELEASE_TAG}.apk" > "morph-${RELEASE_TAG}.apk.sha256"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: MORPH ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            morph-${{ env.RELEASE_TAG }}.apk
            morph-${{ env.RELEASE_TAG }}.apk.sha256
